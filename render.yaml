services:
  - type: web
    name: changsha-event-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TZ
        value: Asia/Shanghai
      - key: DATABASE_URL
        sync: false
      - key: COLLECT_SECRET
        generateValue: true
