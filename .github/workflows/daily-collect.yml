name: Daily Changsha Event Collection
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collection endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$SITE_URL/api/collect" \
            -H "X-Collect-Secret: $COLLECT_SECRET"
